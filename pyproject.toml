[project]
name = "pimp-my-social"
version = "0.1.0"
description = "Pimp My Social: a website and social makeover for small businesses, on Meta Muse. Meta hackathon 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2",
    "meta-sam-parser>=0.1.0",
    "python-dotenv>=1",
    "pillow>=11",
    "numpy>=2",
    "requests>=2.31",
    "matplotlib>=3.11.2",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "playwright>=1.64.1",
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

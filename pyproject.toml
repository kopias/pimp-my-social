[project]
name = "sous"
version = "0.1.0"
description = "A sous chef that watches the pan. Meta Muse hackathon 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2",
    "meta-sam-parser>=0.1.0",
    "python-dotenv>=1",
    "pillow>=11",
    "numpy>=2",
    "requests>=2.31",
    "matplotlib>=3.11.2",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

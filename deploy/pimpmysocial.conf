# pimpmysocial.loreto.io -> Pimp My Social on 127.0.0.1:8180 (deploy/pimpmysocial.service)
server {
    listen 80;
    server_name pimpmysocial.loreto.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name pimpmysocial.loreto.io;
    ssl_certificate     /etc/letsencrypt/live/pimpmysocial.loreto.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pimpmysocial.loreto.io/privkey.pem;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/security-headers.conf;
    # uploads of a post to remix are capped at 60 MB in the app
    client_max_body_size 64M;
    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
